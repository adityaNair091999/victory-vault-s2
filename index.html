<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Victory Vault Season 3 — Fantasy Premier League Mini-League Dashboard. Track standings, monthly prizes, Champions League, World Cup, Last Man Standing, FA Cup, and highest GW scores.">
    <title>Victory Vault Season 3 | FPL Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Archivo:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loader-container">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-text">
                <span class="loader-brand">Victory Vault</span>
                <span id="loading-status" class="loader-status">Initializing...</span>
            </div>
        </div>
    </div>

    <!-- App shell: sidebar + body -->
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">VV</div>
                <div class="brand-txt">
                    <div class="brand-name">Victory Vault</div>
                    <div class="brand-sub">Season 3 · 26/27</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav"><!-- grouped nav injected by JS --></nav>
            <div class="sidebar-foot">
                <span id="footer-brand">Victory Vault Season 3</span>
                <span class="sidebar-foot-sub">Data powered by FPL API</span>
            </div>
        </aside>

        <div class="sidebar-scrim" id="sidebar-scrim"></div>

        <div class="app-body">
            <header class="topbar">
                <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <h1 class="topbar-title" id="topbar-title">Overview</h1>
                <div class="topbar-spacer"></div>
                <span class="tb-pill gw-pill" id="current-gw">GW —</span>
                <span class="tb-pill" id="players-pill">— Players</span>
                <div class="tb-pool">
                    <span class="tb-pool-k">Prize Pool</span>
                    <span class="tb-pool-v" id="pool-value">$—</span>
                </div>
                <span id="last-updated" class="last-updated">Not yet loaded</span>
                <button id="refresh-btn" class="tb-refresh" onclick="APP.forceRefresh()" aria-label="Refresh data">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span class="tb-refresh-lbl">Refresh</span>
                </button>
            </header>

            <main class="app-main">
                <div id="tab-content" class="tab-content">
                    <!-- Content injected by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/competitions.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
